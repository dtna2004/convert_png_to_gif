a<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chuyển đổi PNG sang GIF</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Chuyển đổi PNG sang GIF</h1>

        <div id="key-section">
            <h2>Vui lòng nhập Key để sử dụng</h2>
            <input type="text" id="access-key" placeholder="Nhập key của bạn...">
            <button id="submit-key">Vào Web</button>
            <p id="key-message" class="message"></p>
        </div>

        <div id="converter-section" style="display: none;">
            <h2>Upload file PNG của bạn</h2>
            <form id="upload-form">
                <input type="file" id="png-file-input" name="pngfile" accept="image/png" required>
                <button type="submit">Chuyển đổi</button>
            </form>
            <p id="convert-message" class="message"></p>
            <div id="result-section" style="display: none;">
                <h3>Chuyển đổi thành công!</h3>
                <a id="download-link" download="converted.gif">Tải xuống file GIF</a>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
